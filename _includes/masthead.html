<div class="masthead"><div class="masthead__inner-wrap">
<a class="site-wordmark" href="{{ '/' | relative_url }}">{{ site.name }}<span class="wordmark-dot" aria-hidden="true">.</span></a>
<nav class="personal-nav" aria-label="Main navigation">
{% for link in site.data.navigation.main %}<a href="{{ link.url | relative_url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a>{% endfor %}
</nav></div></div>
