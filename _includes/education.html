{% comment %}Education is shared between the public CV and any future overview page.{% endcomment %}
<div class="education-list">
{% for item in site.data.profile.education %}
  <div class="education-entry"><p class="education-date">{{ item.dates }}</p><h3>{{ item.degree }}</h3><p>{{ item.institution }}</p></div>
{% endfor %}
</div>
